name: Market Hours Cloud Autonomous Monitor

on:
  schedule:
    # Run every 5 minutes during US market hours (13:15 to 20:05 UTC, Monday to Friday)
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-market-scan:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Trigger Cloud Market Scanner & Record Signals
        run: |
          node scripts/autonomous-market-runner.js

      - name: Commit and Push Recorded Trades
        run: |
          git config --global user.name "Autonomous Market Bot"
          git config --global user.email "bot@options-tracker.ai"
          git status
          if [ -n "$(git status --porcelain data/live-ledger.json)" ]; then
            echo "New market signals recorded. Committing to repository..."
            git add data/live-ledger.json
            git commit -m "chore(ledger): record real-time market trade [skip ci]"
            git push origin main
          else
            echo "No new trades triggered on this tick. Ledger up to date."
          fi
